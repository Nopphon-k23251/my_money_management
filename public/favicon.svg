<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glass Glow -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Emerald/Gold Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Coin Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Top Glass Highlight -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="url(#glassGlow)" />

  <!-- Outer Border Ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Modern Financial Motif: Wallet/Vault Silhouette with Growth Chart & Coin -->
  <g filter="url(#glow)">
    <!-- Wallet / Vault Body Base -->
    <path d="M14 26C14 21.5817 17.5817 18 22 18H42C46.4183 18 50 21.5817 50 26V42C50 46.4183 46.4183 50 42 50H22C17.5817 50 14 46.4183 14 42V26Z" fill="#1E1B4B" fill-opacity="0.35" />

    <!-- Growth Trend Bars (Fintech / Analytics) -->
    <rect x="20" y="36" width="5" height="8" rx="2" fill="#A5B4FC" />
    <rect x="28" y="30" width="5" height="14" rx="2" fill="#C7D2FE" />
    <rect x="36" y="24" width="5" height="20" rx="2" fill="url(#accentGrad)" />

    <!-- Dynamic Upward Growth Arrow ↗ -->
    <path d="M22 32L30 24L38 18M38 18H31M38 18V25" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkling Wealth Coin / Pearl Dot -->
    <circle cx="43" cy="18" r="3.5" fill="#FBBF24" stroke="#FFFBEB" stroke-width="1" />
  </g>
</svg>